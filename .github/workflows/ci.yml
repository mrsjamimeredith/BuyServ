name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Syntax check all source files
        run: |
          for f in src/*.js public/*.js; do
            node --check "$f"
          done
